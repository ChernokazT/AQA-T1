plugins {
    id 'java'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'

    testImplementation 'org.assertj:assertj-core:3.25.3'

    implementation("io.rest-assured:rest-assured:6.0.1")
}

test {
    useJUnitPlatform {
        excludeTags 'negative'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.register('runAllTests', Test) {
    useJUnitPlatform {
        excludeTags 'negative'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
    doFirst {
        println "=== TEST RUN STARTED ==="
    }
    doLast {
        println "=== TEST RUN FINISHED ==="
    }
}

tasks.register('runTask1Tests', Test) {
    useJUnitPlatform {
        includeTags 'task1'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.register('runLecture3Tests', Test) {
    useJUnitPlatform {
        includeTags 'lecture3'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.register('runNegativeTests', Test) {
    useJUnitPlatform {
        includeTags 'negative'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

tasks.register('afterTestsMessage') {
    doLast {
        println "Test run is over"
    }
}

tasks.register('runApiTests', Test) {
    useJUnitPlatform {
        includeTags 'api'
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}


afterTestsMessage.dependsOn runAllTests
